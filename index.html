<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141d2b" />
    <meta name="description" content="Three rivers. One very tired snail. A snowy pixel-art puzzle adventure." />
    <title>TurboTale</title>
  </head>
  <body>
    <div id="app">
      <main id="game-shell" aria-label="TurboTale game" aria-describedby="game-instructions">
        <div id="game-root"></div>
        <div id="hud-root"></div>
      </main>
      <p id="rotate-note">Turn your phone sideways for a better view.</p>
      <p id="game-instructions" class="sr-only">Tap to begin or continue dialogue. Swipe to move one cell. Hold to hear a comment. Hold the attempt counter to reveal monsters on the final bridges. Keyboard: arrows or WASD to move, Enter or Space to continue, Escape for a comment, R to reveal monsters.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
